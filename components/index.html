  function getThemePreference() {
    if (typeof localStorage !== "undefined") {
      return localStorage.getItem("theme") ?? "light"
    }
    return window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark"
      : "light"
  }

  function updateTheme(theme) {
    const isDark = theme === "dark"
    document.documentElement.classList[isDark ? "add" : "remove"]("dark")
    localStorage.setItem("theme", theme)

    // Update slider position and icons
    const slider = document.getElementById("theme-toggle-slider")
    const lightIcon = document.getElementById("light-icon")
    const darkIcon = document.getElementById("dark-icon")

    if (slider && lightIcon && darkIcon) {
      if (isDark) {
        slider.style.transform = "translateX(1.75rem)"
        lightIcon.style.opacity = "0"
        darkIcon.style.opacity = "1"
      } else {
        slider.style.transform = "translateX(0)"
        lightIcon.style.opacity = "1"
        darkIcon.style.opacity = "0"
      }
    }
  }

  // Initialize theme on page load
  updateTheme(getThemePreference())

  // Toggle theme on button click
  document.getElementById("theme-toggle-btn")?.addEventListener("click", () => {
    const currentTheme = localStorage.getItem("theme") ?? "light"
    const newTheme = currentTheme === "dark" ? "light" : "dark"
    updateTheme(newTheme)
  })

  // Update theme after page navigation
  document.addEventListener('astro:after-swap', () => {
    updateTheme(getThemePreference())
  })
